services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanam
      POSTGRES_DB: hanam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-transfer.mjs first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - hanam_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanam -d hanam"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hanam_database:
